<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" overflow="visible">
  <title>TITO MYNY — contribution blocks eaten by a snake</title>
  <desc>A pixel snake travels across the large TITO MYNY lettering and eats the blocks that form the letters.</desc>
  <rect width="1000" height="330" rx="22" fill="#0d1117"/>
  <rect x="18" y="18" width="964" height="294" rx="18" fill="none" stroke="#30363d" stroke-width="2"/>

  <g id="letters" fill="#39d353">
    <!-- T -->
    <g id="T"><rect x="70" y="75" width="40" height="40"/><rect x="115" y="75" width="40" height="40"/><rect x="160" y="75" width="40" height="40"/>
      <rect x="115" y="120" width="40" height="40"/><rect x="115" y="165" width="40" height="40"/><rect x="115" y="210" width="40" height="40"/></g>
    <!-- I -->
    <g id="I"><rect x="225" y="75" width="40" height="40"/><rect x="225" y="120" width="40" height="40"/><rect x="225" y="165" width="40" height="40"/><rect x="225" y="210" width="40" height="40"/></g>
    <!-- T -->
    <g id="T2"><rect x="290" y="75" width="40" height="40"/><rect x="335" y="75" width="40" height="40"/><rect x="380" y="75" width="40" height="40"/>
      <rect x="335" y="120" width="40" height="40"/><rect x="335" y="165" width="40" height="40"/><rect x="335" y="210" width="40" height="40"/></g>
    <!-- O -->
    <g id="O"><rect x="445" y="75" width="40" height="40"/><rect x="490" y="75" width="40" height="40"/><rect x="535" y="75" width="40" height="40"/>
      <rect x="445" y="120" width="40" height="40"/><rect x="535" y="120" width="40" height="40"/><rect x="445" y="165" width="40" height="40"/><rect x="535" y="165" width="40" height="40"/>
      <rect x="445" y="210" width="40" height="40"/><rect x="490" y="210" width="40" height="40"/><rect x="535" y="210" width="40" height="40"/></g>

    <!-- M -->
    <g id="M"><rect x="625" y="75" width="40" height="40"/><rect x="625" y="120" width="40" height="40"/><rect x="625" y="165" width="40" height="40"/><rect x="625" y="210" width="40" height="40"/>
      <rect x="670" y="75" width="40" height="40"/><rect x="715" y="75" width="40" height="40"/><rect x="760" y="75" width="40" height="40"/><rect x="760" y="120" width="40" height="40"/><rect x="760" y="165" width="40" height="40"/><rect x="760" y="210" width="40" height="40"/></g>
    <!-- Y -->
    <g id="Y"><rect x="815" y="75" width="40" height="40"/><rect x="905" y="75" width="40" height="40"/><rect x="860" y="120" width="40" height="40"/><rect x="860" y="165" width="40" height="40"/><rect x="860" y="210" width="40" height="40"/></g>
  </g>

  <!-- Small contribution-style blocks -->
  <g opacity=".28" fill="#39d353">
    <rect x="70" y="40" width="12" height="12"/><rect x="88" y="40" width="12" height="12"/><rect x="106" y="40" width="12" height="12"/>
    <rect x="620" y="40" width="12" height="12"/><rect x="638" y="40" width="12" height="12"/><rect x="656" y="40" width="12" height="12"/>
    <rect x="930" y="270" width="12" height="12"/><rect x="948" y="270" width="12" height="12"/>
  </g>

  <!-- Blocks fade away as the snake eats across the letters -->
  <g fill="#0d1117">
    <rect x="0" y="0" width="0" height="0">
      <animate attributeName="width" values="0;0;1000;1000" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Snake: head + body. It travels through the lettering, then escapes the frame. -->
  <g id="snake" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M -55 285 C 20 285 20 265 70 265 S 150 285 190 255 S 270 220 310 245 S 390 270 430 230 S 520 190 555 150 S 635 105 690 125 S 760 155 805 120 S 885 95 965 65 S 1030 35 1080 5"
          fill="none" stroke="#2ea043" stroke-width="30" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 2200;2200 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle r="22" fill="#39d353">
      <animateMotion dur="12s" repeatCount="indefinite" path="M -55 285 C 20 285 20 265 70 265 S 150 285 190 255 S 270 220 310 245 S 390 270 430 230 S 520 190 555 150 S 635 105 690 125 S 760 155 805 120 S 885 95 965 65 S 1030 35 1080 5"/>
    </circle>
    <circle r="5" fill="#0d1117" cx="-7" cy="-6">
      <animateMotion dur="12s" repeatCount="indefinite" path="M -55 285 C 20 285 20 265 70 265 S 150 285 190 255 S 270 220 310 245 S 390 270 430 230 S 520 190 555 150 S 635 105 690 125 S 760 155 805 120 S 885 95 965 65 S 1030 35 1080 5"/>
    </circle>
  </g>

  <!-- Animated mask creates the impression that eaten letter blocks disappear behind the snake. -->
  <mask id="eatMask">
    <rect width="1000" height="330" fill="white"/>
    <circle r="38" fill="black">
      <animateMotion dur="12s" repeatCount="indefinite" path="M -55 285 C 20 285 20 265 70 265 S 150 285 190 255 S 270 220 310 245 S 390 270 430 230 S 520 190 555 150 S 635 105 690 125 S 760 155 805 120 S 885 95 965 65 S 1030 35 1080 5"/>
    </circle>
  </mask>

  <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" letter-spacing="3">TITOWARE • TITO MYNY</text>
</svg>